name: XRRRDP

on:
  workflow_dispatch:

jobs:
  ignite-windows:
    runs-on: windows-latest
    steps:
      - name: GPU Destekli Tam Kurulum
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          Write-Host "1. RDP ve Kimlik Ayarları Mühürleniyor..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          Write-Host "2. Yönetici ve Şifre Revizyonu..."
          $Password = ConvertTo-SecureString $Env:RDP_PASSWORD -AsPlainText -Force
          $User = Get-LocalUser -Name "runneradmin"
          $User | Set-LocalUser -Password $Password
          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
          
          Write-Host "3. GPU Boost (Mesa3D) Hazırlanıyor..."
          $DesktopPath = [Environment]::GetFolderPath("Desktop")
          Invoke-WebRequest "https://github.com/pal1000/mesa-dist-win/releases/download/24.0.7/mesa3d-24.0.7-release-msvc.7z" -OutFile mesa.7z
          Move-Item mesa.7z "$DesktopPath\tmmmGPU_BOOST.7z"
          
          Write-Host "4. Pinggy TCP Tüneli Başlatılıyor ve Adres Bekleniyor..."
          # Job olarak başlatıp stdout akışını anlık okuyoruz
          $job = Start-Job -ScriptBlock {
              ssh -p 443 -o StrictHostKeyChecking=no -R0:localhost:3389 tcp@free.pinggy.io 2>&1
          }
          
          # Tünelin ayağa kalkması ve URL üretmesi için 7 saniye tanıyoruz
          Start-Sleep -s 7
          $jobOutput = Receive-Job -Job $job
          
          Write-Host "=================================================================="
          Write-Host "🎉 aMATRIX IS UNSTOPPABLE!"
          Write-Host "Tünel Çıktısı / Adres:"
          $jobOutput | ForEach-Object { Write-Host $_ }
          Write-Host "------------------------------------------------------------------"
          Write-Host "👉 'mstsc' aç ve yukarıdaki çıktıta yer alan tcp://... adresini yapıştır!"
          Write-Host "👤 KULLANICI  : runneradmin"
          Write-Host "🔑 ŞİFRE      : (Tanımladığınız RDP_PASSWORD)"
          Write-Host "=================================================================="
          
          # İşlemin canlı kalması için döngü
          while ($true) { Start-Sleep -s 60 }
